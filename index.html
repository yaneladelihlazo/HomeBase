<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Home Base </title>

<body>

  <div class="container">
      <video class="back-video" loop autoplay muted playsinline >
          <source src="/videos/galaxy.mp4" type="video/mp4">
      </video>
      <header>
          <div class="left">
              <img src="/images/CyberLogo2.png" alt="logo">

              <!-- <span> makes the color change in the word possible -->

          <ul>

          <div class="box-icons">

              </p>

              <button> <i class="bx bx-send"></i> Contact Me!</button>
          </div>

          <div class="hero-vid-box">
              <video playsinline muted loop autoplay>
                  <source src="/videos/hero-video.mp4" type="video/mp4">
              </video>
          </div>

          <div class="scroll-down"> </div>
